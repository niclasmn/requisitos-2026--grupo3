<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRI Unifor | Mobilidade e Pesquisa Internacional</title>
    <meta
      name="description"
      content="Oportunidades e mobilidade internacional da Universidade de Fortaleza."
    />
    <meta property="og:title" content="DRI | Universidade de Fortaleza" />
    <meta
      property="og:description"
      content="Oportunidades e mobilidade internacional da Universidade de Fortaleza."
    />
    <meta property="og:type" content="website" />
    <style>
      /* =========================================================================
         1. DESIGN TOKENS & THEME VARIABLES (PUMI / UNIFOR VISUAL SYSTEM)
         ========================================================================= */
      :root {
        --font-sans: Arial, Helvetica, sans-serif;
        --background: oklch(0.975 0.008 260);
        --foreground: oklch(0.27 0.065 265);
        --card: oklch(1 0 0);
        --primary: oklch(0.5005711 0.2625788 263.367);
        --primary-foreground: oklch(1 0 0);
        --institutional: oklch(0.3345389 0.1662227 268.886);
        --secondary: oklch(0.9542716 0.0215381 265.764);
        --secondary-foreground: oklch(0.5005711 0.2625788 263.367);
        --muted: oklch(0.968 0.011 260);
        --muted-foreground: oklch(0.49 0.029 262);
        --accent: oklch(0.9471881 0.0257136 253.566);
        --accent-foreground: oklch(0.5005711 0.2625788 263.367);
        --border: oklch(0.9 0.023 260);
        --warning: oklch(0.959 0.061 85);
        --warning-foreground: oklch(0.423 0.085 75);
        --success: oklch(0.944 0.036 165);
        --success-foreground: oklch(0.388 0.07 167);
        --destructive: oklch(0.55 0.19 28);
        --destructive-foreground: oklch(1 0 0);
        --shadow: 0 8px 30px oklch(0.2 0.07 265 / 0.12);
        --radius: 8px;
      }

      .high-contrast {
        --background: oklch(0.1 0 0);
        --foreground: oklch(1 0 0);
        --card: oklch(0.16 0 0);
        --primary: oklch(0.9 0.19 100);
        --primary-foreground: oklch(0.1 0 0);
        --institutional: oklch(0.24 0 0);
        --secondary: oklch(0.24 0 0);
        --secondary-foreground: oklch(0.9 0.19 100);
        --muted: oklch(0.2 0 0);
        --muted-foreground: oklch(0.88 0 0);
        --accent: oklch(0.26 0 0);
        --accent-foreground: oklch(0.9 0.19 100);
        --border: oklch(0.6 0 0);
        --warning: oklch(0.24 0.05 85);
        --warning-foreground: oklch(0.95 0.1 90);
        --success: oklch(0.2 0.04 160);
        --success-foreground: oklch(0.9 0.08 160);
      }

      /* =========================================================================
         2. BASE & ACCESSIBILITY RESET
         ========================================================================= */
      * {
        box-sizing: border-box;
        border-color: var(--border);
        letter-spacing: 0;
      }
      html {
        scroll-behavior: smooth;
        font-size: 16px;
      }
      html[data-font="-1"] {
        font-size: 14px;
      }
      html[data-font="1"] {
        font-size: 18px;
      }
      html[data-font="2"] {
        font-size: 20px;
      }
      body {
        margin: 0;
        font-family: var(--font-sans);
        color: var(--foreground);
        background: var(--background);
        line-height: 1.45;
      }
      h1,
      h2,
      h3,
      h4,
      p,
      figure {
        margin: 0;
      }
      h1 {
        font-size: 2.5rem;
        line-height: 1.25;
        font-weight: 700;
      }
      h2 {
        font-size: 1.75rem;
        line-height: 1.3;
        font-weight: 700;
        margin-bottom: 18px;
      }
      h3 {
        font-size: 1.3rem;
        line-height: 1.35;
        font-weight: 700;
        margin-bottom: 14px;
      }
      h4 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: var(--muted-foreground);
        margin-bottom: 16px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a,
      button,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      button,
      a,
      select,
      input[type="checkbox"],
      input[type="radio"] {
        touch-action: manipulation;
      }
      button {
        font-family: inherit;
        white-space: normal !important;
        border: 0;
        background: transparent;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--primary);
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--foreground);
        background: var(--muted);
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 13px 14px;
        width: 100%;
        min-width: 0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        outline: 2px solid var(--secondary);
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      input[type="checkbox"],
      input[type="radio"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        padding: 0;
        flex-shrink: 0;
      }
      label {
        cursor: pointer;
      }

      /* =========================================================================
         3. BUTTON PRIMITIVES & UTILITY HELPERS
         ========================================================================= */
      .btn,
      .inline-flex {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease,
          opacity 0.15s ease;
        min-height: 36px;
        padding: 8px 16px;
        text-decoration: none;
      }
      .btn:disabled {
        pointer-events: none;
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn svg {
        pointer-events: none;
        flex-shrink: 0;
      }
      .btn-default {
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
      }
      .btn-default:hover {
        opacity: 0.92;
      }
      .btn-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .btn-secondary:hover {
        background: var(--accent);
      }
      .btn-destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .btn-destructive:hover {
        opacity: 0.92;
      }
      .btn-outline {
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .btn-outline:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .btn-ghost {
        background: transparent;
        color: inherit;
      }
      .btn-ghost:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .btn-link {
        background: transparent;
        color: var(--primary);
        padding: 0;
        min-height: auto;
        justify-content: flex-start;
      }
      .btn-link:hover {
        text-decoration: underline;
      }
      .btn-sm {
        min-height: 32px;
        padding: 6px 12px;
        font-size: 0.75rem;
      }
      .btn-icon {
        width: 36px;
        height: 36px;
        padding: 0;
      }
      .justify-start {
        justify-content: flex-start;
      }
      .mt-2 {
        margin-top: 8px;
      }
      .mt-3 {
        margin-top: 12px;
      }
      .mt-4 {
        margin-top: 16px;
      }
      .mt-5 {
        margin-top: 20px;
      }
      .mt-6 {
        margin-top: 24px;
      }
      .mt-7 {
        margin-top: 28px;
      }
      .mb-3 {
        margin-bottom: 12px;
      }
      .mb-4 {
        margin-bottom: 16px;
      }
      .mb-5 {
        margin-bottom: 20px;
      }
      .mr-2 {
        margin-right: 8px;
      }
      .p-0 {
        padding: 0 !important;
      }
      .inline {
        display: inline;
      }
      .block {
        display: block;
      }
      .text-sm {
        font-size: 0.875rem;
      }
      .text-destructive {
        color: var(--destructive);
      }
      .text-muted-foreground {
        color: var(--muted-foreground);
      }
      .text-warning-foreground {
        color: var(--warning-foreground);
      }

      /* =========================================================================
         4. INSTITUTIONAL CHROME & LAYOUT
         ========================================================================= */
      .container {
        width: 88.8889%;
        max-width: 1440px;
        margin: 0 auto;
      }
      .accessibility {
        background: var(--institutional);
        color: var(--primary-foreground);
        position: sticky;
        top: 0;
        z-index: 40;
        font-size: 0.6875rem;
        min-height: 31px;
      }
      .access-inner,
      .access-actions,
      .portal-links {
        display: flex;
        align-items: center;
      }
      .access-inner {
        justify-content: space-between;
      }
      .access-actions {
        gap: 10px;
      }
      .access-actions button {
        color: inherit;
        font-size: inherit;
        padding: 0 3px;
        height: 29px;
        min-height: 29px;
        box-shadow: none;
      }
      .access-actions button:hover {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .portal-links {
        gap: 18px;
      }
      .brand-header {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .brand-inner {
        display: flex;
        align-items: center;
        gap: 30px;
        min-height: 89px;
      }
      .unifor-logo {
        width: 169px;
        height: auto;
        display: block;
      }
      .dri-brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dri-brand strong {
        font-size: 1.8rem;
        line-height: 1.2;
      }
      .dri-brand span {
        font-size: 0.72rem;
      }
      .account-button {
        margin-left: auto;
        width: 151px;
        height: 38px !important;
        background: var(--card);
        color: var(--primary);
        font-size: 0.78rem !important;
      }
      .main-nav {
        background: var(--card);
      }
      .nav-inner {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        font-size: 0.77rem;
        font-weight: 600;
      }
      .nav-inner > a {
        padding: 15px 0;
      }
      .nav-inner .active,
      .nav-inner .language {
        color: var(--primary);
      }
      .mobile-menu {
        display: none;
      }
      .main-content {
        min-height: 60vh;
        padding-bottom: 48px;
      }
      .breadcrumb {
        font-size: 0.625rem;
        font-weight: 700;
        color: var(--primary);
        padding: 30px 0 27px;
      }
      .hero {
        background: var(--institutional);
        color: var(--primary-foreground);
        border-radius: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        padding: 36px;
        align-items: center;
        min-height: 393px;
      }
      .hero h1 {
        font-size: 2.65rem;
        line-height: 1.3;
        margin: 18px 0;
      }
      .hero p {
        color: inherit;
        font-size: 1rem;
        line-height: 1.4;
      }
      .eyebrow {
        font-size: 0.625rem !important;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 16px;
        line-height: 1.5;
      }
      .hero .eyebrow {
        color: inherit;
        opacity: 0.85;
      }
      .hero small {
        font-size: 0.6875rem;
        display: block;
        opacity: 0.8;
        margin-top: 15px;
      }
      .hero figure {
        min-width: 0;
      }
      .hero img {
        width: 100%;
        aspect-ratio: 1.78;
        object-fit: cover;
        border-radius: 12px;
        display: block;
      }
      .hero figcaption {
        font-size: 0.6875rem;
        opacity: 0.8;
        margin-top: 13px;
      }
      .hero button,
      .hero a[data-slot] {
        margin-top: 0;
      }
      .hero a.inline-flex {
        height: 43px;
        min-width: 248px;
        font-size: 0.8rem;
      }
      .home-section {
        margin-top: 30px;
      }
      .grid-three {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
      .grid-two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .item-card {
        background: var(--card);
        border-radius: 12px;
        padding: 22px;
      }
      .item-card h3 {
        font-size: 1.3rem;
      }
      .item-card p {
        font-size: 0.8rem;
        line-height: 1.45;
      }
      .item-card .eyebrow {
        margin-bottom: 14px;
      }
      .item-card .text-link {
        font-size: 0.8rem;
      }
      .journey-card {
        min-height: 173px;
      }
      .text-link {
        color: var(--primary);
        font-weight: 600;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .text-link:hover {
        text-decoration: underline;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: baseline;
      }
      .section-heading > .text-link {
        font-size: 0.75rem;
        flex-shrink: 0;
      }
      .deadline {
        color: var(--success-foreground) !important;
        font-size: 0.73rem !important;
        font-weight: 600;
      }
      .fine-print {
        font-size: 0.65rem;
        margin: 15px 0;
        color: var(--muted-foreground);
      }
      .feature-banner {
        padding: 28px;
        background: var(--accent);
        border-radius: 12px;
      }
      .feature-banner h2 {
        color: var(--institutional);
        font-size: 1.75rem;
      }
      .feature-banner p:not(.eyebrow) {
        font-size: 0.875rem;
      }
      .feature-banner.subtle {
        background: var(--card);
      }
      .feature-banner .inline-flex {
        min-height: 43px;
        font-size: 0.8rem;
      }
      .news-card {
        padding: 18px;
      }
      .news-card > img {
        width: 100%;
        aspect-ratio: 2.55;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 17px;
      }
      .metrics-band {
        background: var(--institutional);
        color: var(--primary-foreground);
        padding: 28px;
        border-radius: 12px;
        margin-top: 28px;
      }
      .metrics-band .eyebrow {
        color: inherit;
        opacity: 0.85;
        margin: 24px 0;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 20px;
      }
      .metrics-grid strong {
        font-size: 2.3rem;
      }
      .metrics-grid p {
        color: inherit;
        font-size: 0.8rem;
        margin-top: 14px;
      }
      .metrics-band small {
        font-size: 0.6rem;
        opacity: 0.85;
      }
      .inline-links {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .site-footer {
        background: var(--institutional);
        color: var(--primary-foreground);
        padding: 30px 0;
      }
      .footer-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }
      .site-footer h3 {
        font-size: 1rem;
        margin-bottom: 9px;
      }
      .site-footer p,
      .footer-links {
        font-size: 0.72rem;
        color: inherit;
      }
      .site-footer p {
        opacity: 0.85;
        margin: 0;
      }
      .footer-links > div {
        display: flex;
        gap: 16px;
        margin-bottom: 8px;
      }
      .footer-links > div + div {
        opacity: 0.8;
      }
      .demo-switcher {
        position: fixed;
        bottom: 16px;
        right: 18px;
        z-index: 45;
      }
      .demo-switcher > button {
        font-size: 0.7rem;
        box-shadow: var(--shadow);
        background: var(--card);
        height: 34px;
      }
      .profile-menu {
        position: absolute;
        bottom: 46px;
        right: 0;
        background: var(--card);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 280px;
        padding: 12px;
      }
      .profile-menu > button {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .profile-menu > button.profile-dev-btn {
        border-top: 1px solid var(--border);
        margin-top: 6px;
        padding-top: 10px;
        font-weight: 700;
        color: var(--institutional);
      }
      .profile-menu small {
        display: block;
        color: var(--muted-foreground);
        font-size: 0.65rem;
        border-top: 1px solid var(--border);
        padding-top: 10px;
        margin-top: 8px;
      }
      .profile-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--muted-foreground);
      }
      .skip-link {
        position: fixed;
        top: -100px;
        left: 10px;
        z-index: 100;
        background: var(--card);
        color: var(--primary);
        padding: 10px;
      }
      .skip-link:focus {
        top: 5px;
      }
      .intro {
        margin: 0 0 30px;
      }
      .intro h1 {
        margin: 10px 0 32px;
      }
      .intro > p {
        font-size: 1rem;
      }
      .panel {
        background: var(--card);
        padding: 26px;
        border-radius: 12px;
        margin-bottom: 18px;
      }
      .notice {
        padding: 25px;
        background: var(--accent);
        border-radius: 12px;
        margin-bottom: 18px;
        color: var(--institutional);
      }
      .notice p {
        color: inherit;
        margin-bottom: 0;
      }
      .notice h3 {
        color: inherit;
      }
      .notice.warning {
        background: var(--warning);
        color: var(--warning-foreground);
      }
      .notice.success {
        background: var(--success);
        color: var(--success-foreground);
      }
      .notice div {
        font-size: 0.9rem;
      }
      .sidebar-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 30px;
      }
      .right-sidebar-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 28px;
      }
      .sidebar-layout > *,
      .right-sidebar-layout > *,
      .grid-two > *,
      .grid-three > * {
        min-width: 0;
      }
      .sidebar-layout > aside.panel > a.text-link {
        display: flex;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .field > span {
        font-weight: 600;
        font-size: 0.76rem;
      }
      .field select,
      .field input {
        min-height: 44px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .field-grid .field {
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 20px;
      }
      .actions .inline-flex {
        min-height: 42px;
      }
      .steps {
        padding: 0;
        list-style: none;
        counter-reset: steps;
        color: var(--foreground);
        font-size: 0.9rem;
      }
      .steps li {
        counter-increment: steps;
      }
      .steps li:before {
        content: counter(steps, decimal-leading-zero) "  ";
        white-space: pre;
      }
      .dark-panel {
        background: var(--institutional);
        color: var(--primary-foreground);
      }
      .dark-panel p,
      .dark-panel .eyebrow {
        color: inherit;
      }
      .dark-panel p {
        opacity: 0.85;
      }
      .dark-panel button {
        width: 100%;
        min-height: 44px;
      }
      .dark-panel h2 {
        font-size: 1.9rem;
      }
      .dark-panel h3 {
        font-size: 1.45rem;
      }
      .full-width {
        width: 100%;
      }
      .preserve-lines {
        white-space: pre-wrap;
      }
      .tabs-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 7px 12px;
        background: var(--card);
        border-radius: 12px;
        margin: 30px 0;
      }
      .tabs-bar button {
        color: var(--muted-foreground);
      }
      .tabs-bar button[aria-selected="true"],
      .tabs-bar button[aria-pressed="true"] {
        color: var(--primary);
        font-weight: 700;
      }
      .search-row {
        display: grid;
        grid-template-columns: 1fr 206px;
        gap: 16px;
        margin-bottom: 16px;
      }
      .search-row input,
      .search-row select {
        background: var(--card);
      }
      .results-count {
        font-size: 0.75rem;
      }
      .catalog-card {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 16px;
        padding: 24px;
      }
      .catalog-card h3 {
        font-size: 1.45rem;
      }
      .catalog-card p:last-child {
        margin-bottom: 0;
      }
      .catalog-card-actions {
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex-shrink: 0;
        min-width: 175px;
      }
      .compare-check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted-foreground);

      .globe-dot.blue.pulsing {
        background: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.28);
        animation: mapPinPulse 2.2s ease-in-out infinite;
      }
      .world-map-wrapper {
        position: relative;
        background: #dbeafe;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .world-map-svg {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 2 / 1;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .world-map-svg:active {
        cursor: grabbing;
      }
      @keyframes mapPinPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.65);
          opacity: 0.25;
        }
      }
      [data-map-pin][data-open-call="true"] .map-pin-halo {
        transform-box: fill-box;
        transform-origin: center;
        animation: mapPinPulse 2.2s ease-in-out infinite;
      }
      .map-pin-tooltip {
        position: absolute;
        transform: translate(-50%, calc(-100% - 12px));
        background: #0f172a;
        color: #ffffff;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 0.74rem;
        line-height: 1.3;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
        pointer-events: none;
        z-index: 6;
        white-space: nowrap;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .map-pin-tooltip span {
        font-size: 0.65rem;
        color: #93c5fd;
        font-weight: 600;
      }
      .map-pin-tooltip::after {
        content: "";

        return status === "Aguardando Marketing" && checks.length === 7 && checks.every(Boolean);

      function nextInterestStatus(status) {
        if (status === "Recebida") return "Em orientação";
        if (status === "Em orientação") return "Concluída";
        return "Recebida";
      }

      function approvePendingContent(contents, checks) {
        const target = contents.find((c) => c.status === "Aguardando Marketing");
        if (!target || !canPublish(target.status, checks)) {
          return { contents };
        }
        return {
          approvedTitle: target.title,
          contents: contents.map((c) =>
            c.id === target.id ? { ...c, status: "Publicado", comment: "" } : c,
          ),
        };

      function cycleOpportunityStatus(status) {
        const idx = OPPORTUNITY_STATUS_CYCLE.indexOf(status);
        if (idx === -1) return OPPORTUNITY_STATUS_CYCLE[0];
        return OPPORTUNITY_STATUS_CYCLE[(idx + 1) % OPPORTUNITY_STATUS_CYCLE.length];
      }

      function slugifyId(text) {
        const clean = String(text || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 36);
        return clean || "oportunidade";
      }

      function createOpportunityFromInput(input, existingIds) {
        const partner = PARTNER_INSTITUTIONS.find((p) => p.id === input.institutionId);
        const title = (input.title || "").trim() || "Nova oportunidade internacional";
        const institutionName =
          partner?.name || (input.customInstitution || "").trim() || "Instituição conveniada DRI";
        const country = ((input.country || "").trim() || partner?.country || "Portugal").trim();
        const city = ((input.city || "").trim() || partner?.city || "Porto").trim();
        const audience = input.audience || partner?.audience || "Estudante Unifor";
        const mode = input.mode || partner?.mode || "Presencial";
        const status = input.status || "Inscrições abertas";
        const date = (input.date || "").trim();
        const languages = (input.languages || "").trim() || partner?.languages || "Inglês e idioma local";
        const academicAreas =
          (input.academicAreas || "").trim() || partner?.areas || "Todas as áreas compatíveis";

        const baseId = slugifyId(title);
        let uniqueId = baseId;
        let suffix = 2;
        while (existingIds.includes(uniqueId)) {
          uniqueId = `${baseId}-${suffix}`;
          suffix += 1;
        }

        return {
          id: uniqueId,
          publishedAt: new Date().toISOString(),
          tag: `${audience.toUpperCase()} · TESTE DEV`,
          title,
          description: `${audience} · ${institutionName} · ${country} · ${mode}`,

          deadline: date ? `Até ${date} · Prazo ilustrativo` : "Consulte as condições da chamada",

          institution: institutionName,
          institutionId: partner?.id || "",

      function checkEligibility(pmg, proficiency) {
        if (!Number.isFinite(pmg) || pmg < 0 || pmg > 10) {
          return "Informe um PMG válido entre 0 e 10.";
        }
        if (pmg < 7.0) {
          return "Perfil não atende ao critério mínimo obrigatório de PMG maior ou igual a 7.0.";
        }
        if (!["B2", "C1", "C2"].includes(proficiency)) {
          return "Atenção ao requisito de proficiência: B2 é a referência ilustrativa desta simulação. Confira as exigências específicas do edital com a DRI.";
        }
        return "PMG mínimo demonstrativo atendido. Confira também os demais critérios obrigatórios, a documentação e as condições do edital com a DRI.";
      }

      const SIMULATOR_LANGUAGE_OPTIONS = [
        "Português",
        "Inglês (B1)",
        "Inglês (B2)",

      const DEFAULT_SIMULATOR_PROFILE = {
        degree: "Graduação",
        course: UNIFOR_COURSES[0],
        semester: 5,
        pmg: 8.0,
        completedPercent: 45,
        language: "Inglês (B2)",
        hasPassport: true,
        hasStudentVisa: true,
        noFailures: true,
      };

      const CEFR_ORDER = { Nenhum: 0, B1: 1, B2: 2, C1: 3, C2: 4 };

      function institutionMandatoryFailures(profile, institution) {
        if (profile.degree === "Docente") return [];
        const requiredPmg = Number.isFinite(institution.requiredPmg) ? institution.requiredPmg : 7.0;
        const requiredCourseProgress = Number.isFinite(institution.requiredCourseProgress)
          ? institution.requiredCourseProgress
          : 30;
        const failures = [];

        if (!Number.isFinite(profile.pmg) || profile.pmg < requiredPmg) {
          failures.push(`PMG mínimo exigido: ${requiredPmg.toFixed(1)} ou superior.`);
        }
        if (!Number.isFinite(profile.completedPercent) || profile.completedPercent < requiredCourseProgress) {
          failures.push(`É necessário ter cursado pelo menos ${requiredCourseProgress}% do curso.`);
        }
        if (institution.requiresPassport !== false && !profile.hasPassport) {
          failures.push("É necessário possuir passaporte válido.");
        }
        if (institution.requiresStudentVisa !== false && !profile.hasStudentVisa) {
          failures.push("É necessário possuir visto estudantil válido.");
        }
        if (institution.requiresNoFailures !== false && !profile.noFailures) {
          failures.push("Não pode haver reprovações no histórico acadêmico.");
        }
        return failures;
      }

      function evaluateEligibility(profile, institutions = PARTNER_INSTITUTIONS) {
        if (!Number.isFinite(profile.pmg) || profile.pmg < 0 || profile.pmg > 10) {
          return {
            status: "attention",
            headline: "Informe um PMG válido entre 0 e 10.",
            summary: "Corrija o valor de PMG autodeclarado para simular a compatibilidade.",
            advisories: ["O PMG informado precisa estar entre 0 e 10."],
            matches: [],
          };
        }

        const advisories = [
          `PMG informado: ${Number(profile.pmg).toFixed(1)} / 10. Critério mínimo demonstrativo: 7,0.`,
          `Percentual do curso concluído: ${Number(profile.completedPercent || 0)}%. Critério mínimo: 30%.`,
          `Documentação simulada: ${profile.hasPassport ? "passaporte válido" : "passaporte não informado"} · ${profile.hasStudentVisa ? "visto estudantil válido" : "visto estudantil não informado"}.`,
          profile.noFailures
            ? "Histórico acadêmico simulado sem reprovações."
            : "O perfil indica uma ou mais reprovações no histórico acadêmico.",
        ];

        if (profile.degree === "Graduação") {
          if (profile.semester < 3) {
            advisories.push(
              `No ${profile.semester}º semestre, confirme a integralização de créditos com a coordenação antes de planejar a mobilidade.`,
            );
          } else if (profile.semester >= 9) {
            advisories.push(
              `No ${profile.semester}º semestre, confirme com a coordenação o impacto da mobilidade na colação de grau e no aproveitamento de créditos.`,
            );
          } else {
            advisories.push(
              `Semestre em curso (${profile.semester}º): valide os pré-requisitos no plano de estudos com a coordenação.`,
            );
          }
        } else if (profile.degree === "Pós-graduação") {
          advisories.push(
            "Para pós-graduação, confirme plano de pesquisa, coorientação ou créditos compatíveis com o programa.",
          );
        }

        advisories.push(
          `Regra acadêmica: a frequência mínima obrigatória nas disciplinas é de ${MIN_ATTENDANCE}%, sem possibilidade de flexibilização.`,
        );

        const matches = [];
        const mandatoryFailures = [];
        for (const inst of institutions) {
          if (profile.degree === "Graduação" && inst.audience === "Docente") continue;

          const failures = institutionMandatoryFailures(profile, inst);
          if (failures.length) {
            mandatoryFailures.push(...failures.map((failure) => `${inst.name}: ${failure}`));
            continue;
          }
          if (!inst.acceptedCourses.includes(profile.course)) continue;

          const matchedLangs = [];
          const selectedLanguage = String(profile.language || "");
          const languageMatch = selectedLanguage.match(/^(Inglês|Espanhol|Francês|Alemão)\s+\((B1|B2|C1|C2)\+?\)$/);
          for (const req of inst.acceptedLanguages) {
            if (req.lang === "Português" && selectedLanguage === "Português") {
              matchedLangs.push("Português");
            } else if (
              languageMatch &&
              languageMatch[1] === req.lang &&
              (CEFR_ORDER[languageMatch[2]] || 0) >= (CEFR_ORDER[req.minCefr] || 0)
            ) {
              matchedLangs.push(selectedLanguage);
            }
          }

          if (!matchedLangs.length) continue;

          const matchedReasons = [
            `Área compatível (${profile.course})`,
            `Idioma atendido: ${matchedLangs.join(" / ")}`,
            "Critérios mínimos obrigatórios atendidos",
            inst.opportunityId
              ? "Possui edital demonstrativo vinculado no portal"
              : `Convênio ativo · Modalidade ${inst.mode.toLowerCase()}`,
          ];

          const cautions = inst.attentionNote ? [inst.attentionNote] : [];
          if (inst.audience === "Docente" && profile.degree === "Pós-graduação") {
            cautions.push(
              "Convênio focado em pesquisa e missões docentes; confirme possibilidade de cotutela.",
            );
          }
          if (inst.mode !== "Virtual" && profile.degree === "Graduação" && profile.semester < 3) {
            cautions.push(
              "Confirme se o edital exige integralização adicional de créditos antes do embarque.",
            );
          }

          matches.push({ institution: inst, matchedReasons, cautions });
        }

        matches.sort(
          (a, b) =>
            Number(Boolean(b.institution.opportunityId)) -
            Number(Boolean(a.institution.opportunityId)),
        );

        if (!matches.length) {
          const hasMandatoryFailure = mandatoryFailures.length > 0;
          return {
            status: "attention",
            headline: hasMandatoryFailure
              ? "Perfil não atende aos critérios mínimos obrigatórios."
              : "Nenhuma instituição desta amostra combina com o curso e o idioma informado.",
            summary: hasMandatoryFailure
              ? "Uma ou mais condições obrigatórias não foram atendidas. Ajuste o perfil acadêmico para conferir apenas opções compatíveis."
              : "Confira o idioma selecionado ou consulte a DRI para verificar novas chamadas.",
            advisories: [],
            matches: [],
          };
        }

        const hasTimingAttention = profile.degree === "Graduação" && profile.semester < 3;
        return {
          status: hasTimingAttention ? "attention" : "compatible",
          headline: hasTimingAttention
            ? "Perfil atende aos critérios obrigatórios; confira os pontos de planejamento."
            : "Perfil compatível com as opções encontradas.",
          summary:
            "Esta triagem cruza critérios obrigatórios, área acadêmica, vínculo e idiomas autodeclarados. A elegibilidade oficial depende da validação documental pela DRI e das condições de cada edital.",
          advisories,
          matches,
        };
      }

      function recommendDestinations(answers) {
        const [language, budget, culture, objective] = answers;
        const scores = DESTINATIONS.map((_, i) => {
          let score = 0;
          if (language === "Português ou espanhol" && i < 2) score += 12;
          if (language === "Francês" && i === 2) score += 15;
          if ((language === "Alemão" || language === "Inglês") && i === 3) score += 15;
          const budgetScores = {
            "No limite": [6, 3, 1, 0],
            "Uma boa quantia": [4, 4, 2, 1],
            "Acima da média": [1, 2, 4, 6],
            Bastante: [0, 1, 4, 8],
          };
          score += budgetScores[budget]?.[i] ?? 0;
          if (culture === "Vida praiana" && i === 1) score += 5;
          if (culture === "Patrimônio histórico" && (i === 0 || i === 2)) score += 4;
          if (culture === "Ambiente cosmopolita" && i === 3) score += 4;
          if (culture === "Cultura urbana" && (i === 0 || i === 1)) score += 2;
          if (objective === "Pesquisa e cooperação" && (i === 2 || i === 3)) score += 5;
          if (objective === "Experiência acadêmica" && (i === 0 || i === 1)) score += 2;
          if (objective === "Vivência cultural" && (i === 1 || i === 2)) score += 3;
          if (objective === "Aperfeiçoamento de idioma" && i !== 0) score += 2;
          return { index: i, score };
        });
        return scores
          .sort((a, b) => b.score - a.score || a.index - b.index)
          .slice(0, 2)
          .map((s) => s.index);
      }

      /* =========================================================================
         5. HASH ROUTER & NAVIGATION
         ========================================================================= */
      function parseHash() {
        const raw = (window.location.hash || "#/").replace(/^#/, "");
        const [rawPath, rawQuery] = raw.split("?");
        const path = rawPath && rawPath.startsWith("/") ? rawPath : "/" + (rawPath || "");
        const query = Object.fromEntries(new URLSearchParams(rawQuery || ""));
        let params = {};
        let matched = path;
        if (path.startsWith("/oportunidades/")) {
          const id = decodeURIComponent(path.slice("/oportunidades/".length));
          if (id) {
            matched = "/oportunidades/:id";
            params = { id };
          }
        }
        return { path, matched, query, params };
      }

      function navigate(to) {
        const target = to.startsWith("/") ? to : "/" + to;
        const hashTarget = "#" + target;
        if (window.location.hash === hashTarget) {
          syncRouteFromHash();
        } else {
          window.location.hash = hashTarget;
        }
        window.scrollTo(0, 0);
      }

      function syncRouteFromHash() {
        const parsed = parseHash();
        const prevPath = appState.route.path;
        appState.route = parsed;
        appState.ui.mobileOpen = false;
        appState.ui.profilesOpen = false;

        if (parsed.path === "/oportunidades" && prevPath !== "/oportunidades") {
          appState.ui.catalogTab =
            parsed.query.tab === "instituicoes"
              ? "instituicoes"
              : parsed.query.tab === "elegibilidade"
                ? "elegibilidade"
                : "oportunidades";
          appState.ui.catalogGuideId = null;
          const initialFilters = {
            audience: parsed.query.audience || "Todos os públicos",
            country: parsed.query.country || "Todos os países",
            mode: "Todas",
            status: "Todas",
            date: "",
          };
          appState.ui.catalogFilters = { ...initialFilters };
          appState.ui.catalogApplied = { ...initialFilters };
        } else if (parsed.path === "/oportunidades" && parsed.query.tab) {
          appState.ui.catalogTab =
            parsed.query.tab === "instituicoes"
              ? "instituicoes"
              : parsed.query.tab === "elegibilidade"
                ? "elegibilidade"
                : "oportunidades";
        }
        if (parsed.path !== "/oportunidades") {
          appState.ui.catalogGuideId = null;
        }
        if (parsed.matched === "/oportunidades/:id" && parsed.params.id !== appState.ui.detailId) {
          appState.ui.detailId = parsed.params.id;
          appState.ui.detailDegree = "Graduação";
          appState.ui.detailPmg = "";
          appState.ui.detailProficiency = "Selecione";
          appState.ui.detailResult = "";
          appState.ui.detailInterestModal = false;
          appState.ui.detailConsent = false;
        }
        if (parsed.path === "/gestao" && prevPath !== "/gestao") {
          appState.ui.gestaoMetricEdit = appState.store.metrics.map((m) => ({ ...m }));
        }
        const meta = ROUTE_META[parsed.matched] || {
          title: "DRI | Universidade de Fortaleza",
          description: "Oportunidades e mobilidade internacional da Universidade de Fortaleza.",
        };
        document.title = meta.title;
        render();
      }

          .map((lng) => {
            const x = ((lng + 180) / 360) * 1000;
            return `<line x1="${x}" y1="0" x2="${x}" y2="500" stroke="rgba(30, 64, 175, 0.08)" stroke-width="${(0.8 * labelScale).toFixed(2)}" />`;
          })
          .join("");

        const polygons = LANDMASSES.map((poly) => {
          const pts = poly
            .map(([lng, lat]) => {
              const p = projectFlat(lat, lng);
              return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
            })
            .join(" ");
          return `<polygon points="${pts}" fill="#f8fafc" stroke="#94a3b8" stroke-width="${(0.9 * labelScale).toFixed(2)}" stroke-linejoin="round" />`;
        }).join("");

        const arcs = mapInstitutions
          .map((inst) => {
            const p = projectFlat(inst.lat, inst.lng);
            const isSelected = selectedMapInst && selectedMapInst.id === inst.id;
            return `<path d="${getArcPath(originPoint.x, originPoint.y, p.x, p.y)}" fill="none" stroke="${isSelected ? "#2563eb" : "rgba(37, 99, 235, 0.28)"}" stroke-width="${((isSelected ? 1.8 : 1) * labelScale).toFixed(2)}" stroke-dasharray="${(4 * labelScale).toFixed(2)} ${(4 * labelScale).toFixed(2)}" />`;
          })
          .join("");

        const storeOpps = appState.store.opportunities || INITIAL_OPPORTUNITIES;
        const openInstSet = new Set(
          PARTNER_INSTITUTIONS.filter((inst) =>
            storeOpps.some(
              (o) =>
                o.status === "Inscrições abertas" &&
                (o.institutionId === inst.id || o.id === inst.opportunityId),
            ),
          ).map((inst) => inst.id),
        );

        const pins = mapInstitutions
          .map((inst) => {
            const p = projectFlat(inst.lat, inst.lng);
            const isSelected = selectedMapInst && selectedMapInst.id === inst.id;
            const hasOpenCall = openInstSet.has(inst.id);
            const offset = PIN_LABEL_OFFSETS[inst.id] || { dx: 8, dy: 3, anchor: "start" };
            return `
              <g data-map-pin="${esc(inst.id)}" data-open-call="${hasOpenCall ? "true" : "false"}" data-inst-name="${esc(inst.name)}" data-x="${p.x.toFixed(2)}" data-y="${p.y.toFixed(2)}" role="img" aria-label="${esc(inst.name)} (${esc(inst.city)}, ${esc(inst.country)})${hasOpenCall ? " · Inscrições abertas" : ""}" style="cursor:pointer">
                <title>${esc(inst.name)}</title>
                <circle class="map-pin-halo" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${((isSelected ? 13 : hasOpenCall ? 11 : 9.5) * labelScale).toFixed(2)}" fill="${isSelected ? "rgba(37, 99, 235, 0.3)" : hasOpenCall ? "rgba(37, 99, 235, 0.28)" : "rgba(37, 99, 235, 0.14)"}" />
                <circle class="map-pin-core" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${((isSelected ? 6.5 : 5) * labelScale).toFixed(2)}" fill="${isSelected ? "#1d4ed8" : "#2563eb"}" stroke="#ffffff" stroke-width="${(1.8 * labelScale).toFixed(2)}" />
                <text x="${(p.x + offset.dx * labelScale).toFixed(1)}" y="${(p.y + offset.dy * labelScale).toFixed(1)}" text-anchor="${offset.anchor}" font-size="${((isSelected ? 10.5 : 9.2) * labelScale).toFixed(2)}" font-weight="${isSelected ? "700" : "600"}" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif">${esc(inst.city)}</text>
              </g>
            `;
          })
          .join("");

        return `
          <div class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">MAPA-MUNDI · INSTITUIÇÕES CONVENIADAS</p>
                <h3>Explore as localizações no Mapa-Mundi</h3>
              </div>
            </div>
            <div class="globe-layout">
              <div>
                <div class="world-map-wrapper">
                  <svg
                    id="dri-world-map"
                    class="world-map-svg"
                    viewBox="${view.x} ${view.y} ${view.w} ${view.h}"
                    role="img"
                    aria-label="Mapa-Mundi interativo com pontos azuis das instituições conveniadas"
                  >
                    <defs>
                      <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#eff6ff" />
                        <stop offset="55%" stop-color="#dbeafe" />
                        <stop offset="100%" stop-color="#cfe3fc" />
                      </linearGradient>
                    </defs>
                    <rect x="0" y="0" width="1000" height="500" fill="url(#oceanGrad)" />
                    ${latLines}
                    ${lngLines}
                    ${polygons}
                    ${arcs}
                    <g>
                      <circle cx="${originPoint.x.toFixed(1)}" cy="${originPoint.y.toFixed(1)}" r="${(5 * labelScale).toFixed(2)}" fill="#0f172a" stroke="#ffffff" stroke-width="${(1.6 * labelScale).toFixed(2)}" />
                      <text x="${(originPoint.x + 8 * labelScale).toFixed(1)}" y="${(originPoint.y + 3 * labelScale).toFixed(1)}" font-size="${(10 * labelScale).toFixed(2)}" font-weight="700" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Unifor · Fortaleza</text>
                    </g>
                    ${pins}
                  </svg>
                  <div id="world-map-tooltip" class="map-pin-tooltip" role="tooltip" hidden></div>
                </div>
                <div class="globe-legend">
                  <span><i class="globe-dot blue" aria-hidden="true"></i> Instituição conveniada</span>
                  <span><i class="globe-dot blue pulsing" aria-hidden="true"></i> Edital com inscrições abertas</span>
                  <span><i class="globe-dot origin" aria-hidden="true"></i> Unifor · Fortaleza (Origem)</span>
                  <span>${icon("compass", 13)} Clique em um ponto azul para ver a instituição</span>
                </div>
              </div>
              ${
                selectedMapInst
                  ? `
                <aside class="globe-card" aria-live="polite">
                  <p class="eyebrow">INSTITUIÇÃO SELECIONADA NO MAPA</p>
                  <h3>${esc(selectedMapInst.name)}</h3>
                  <p class="globe-coords">
                    ${esc(selectedMapInst.city)}, ${esc(selectedMapInst.country)} · (${selectedMapInst.lat.toFixed(2)}°, ${selectedMapInst.lng.toFixed(2)}°)
                  </p>
                  <p>${esc(selectedMapInst.summary)}</p>
                  <div class="institution-meta">
                    <div>
                      <strong>Convênio</strong>
                      <span>${esc(selectedMapInst.agreementType)}</span>
                    </div>
                    <div>
                      <strong>Idiomas</strong>
                      <span>${esc(selectedMapInst.languages)}</span>
                    </div>
                    <div>
                      <strong>Áreas</strong>
                      <span>${esc(selectedMapInst.areas)}</span>
                    </div>
                  </div>
                  <div class="actions">
                    <button type="button" class="btn btn-default" data-action="open-institution-guide" data-inst-id="${esc(selectedMapInst.id)}">
                      Ver guia da instituição
                    </button>
                    ${
                      selectedMapInst.opportunityId
                        ? renderGo(`/oportunidades/${selectedMapInst.opportunityId}`, "Ver edital vinculado", true)
                        : ""
                    }
                  </div>
                </aside>
              `
                  : ""
              }
            </div>
            <p class="fine-print">Localizações geográficas das instituições parceiras representadas pelos pontos azuis no Mapa-Mundi. Confirme convênios ativos e vagas vigentes com a DRI.</p>
          </div>
        `;
      }

                      <li>${icon("check-circle", 14)}<span>${esc(reason)}</span></li>

                      .join("")}

                  ${
                    cautions.length

      function renderComparisonPage() {
        const store = appState.store;
        const storeOpps = store.opportunities || INITIAL_OPPORTUNITIES;
        const selectedItems = store.selected
          .map((id) => storeOpps.find((o) => o.id === id))
          .filter(Boolean)
          .map((opp) => {
            const preset = DESTINATIONS.find((d) => d.country === opp.country);
            return (
              preset || {
                city: opp.city,
                country: opp.country,
                language: opp.languages,
                cost: opp.housingAndCosts,
                culture: opp.academicAreas,
                positive: opp.agreementType,
                attention: opp.deadline,
              }
            );
          });
        const items =
          selectedItems.length > 0
            ? selectedItems
            : recommendDestinations(store.answers)
                .map((i) => DESTINATIONS[i])
                .filter(Boolean);

        const rows = [
          ["Idioma", ...items.map((d) => d.language)],
          ["Manutenção estimada / mês", ...items.map((d) => d.cost)],

          ["Visto e documentação", ...items.map(() => "Verifique as regras consulares para estudantes")],

      let activeModalPrevFocus = null;
      let modalHadFocusInitialized = false;

      function render() {
        const { path } = appState.route;
        const ui = appState.ui;
        const en = path === "/arrival-guide";
        document.documentElement.classList.toggle("high-contrast", ui.contrast);
        document.documentElement.dataset.font = String(ui.font);

        const navPaths = ["/", "/oportunidades", "/quiz", "/guias", "/docentes", "/sobre"];

              "Início",
              "Oportunidades",
              "Destinos e quiz",
              "Guias de mobilidade",
              "Docentes e pesquisa",

          ? isMgmt ? "Área de gestão" : appState.auth.role === "international" ? "Arrival Guide" : appState.auth.role === "faculty" ? "Área docente" : "Minha DRI"

        const modalHtml = renderActiveModal();

        const rootEl = document.getElementById("app");
        rootEl.innerHTML = `

          <div class="accessibility">
            <div class="container access-inner">

                <button class="btn btn-ghost btn-sm" aria-label="Restaurar fonte" data-action="font-reset">A</button>
                <button class="btn btn-ghost btn-sm" aria-label="Aumentar fonte" data-action="font-inc">A+</button>

              </div>
              <div class="portal-links">
                <a href="https://unifor.br" target="_blank" rel="noreferrer">PORTAL UNIFOR</a>
                <span>/</span>
                <a href="https://unifor.br/unifor-online" target="_blank" rel="noreferrer">UNIFOR ONLINE</a>
              </div>
            </div>
          </div>
          <header class="brand-header">
            <div class="container brand-inner">
              <a href="#/" aria-label="Universidade de Fortaleza - Início">
                <img class="unifor-logo" src="${ASSETS.logo}" alt="Universidade de Fortaleza" />
              </a>
              <a href="#/" class="dri-brand">
                <strong>DRI</strong>
                <span>Diretoria de Relações Internacionais</span>
              </a>
              <a href="${accountHref}" class="inline-flex btn-secondary account-button">
                ${esc(accountLabel)} ${icon("arrow-right", 15)}
              </a>
              <button class="btn btn-ghost btn-icon mobile-menu" aria-label="Abrir menu" data-action="toggle-mobile">
                ${icon(ui.mobileOpen ? "x" : "menu", 20)}
              </button>
            </div>
          </header>
          <nav class="main-nav ${ui.mobileOpen ? "open" : ""}" aria-label="Menu principal">
            <div class="container nav-inner">
              ${navLabels
                .map((label, i) => {
                  const target = en && i === 3 ? "/arrival-guide" : navPaths[i];
                  const active =
                    path === navPaths[i] ||
                    (i === 1 && path.startsWith("/oportunidades")) ||
                    (i === 2 && path === "/comparador") ||
                    (en && i === 3);
                  return `<a href="#${target}" class="${active ? "active" : ""}">${esc(label)}</a>`;
                })
                .join("")}
              <a class="language" href="#${en ? "/" : "/arrival-guide"}">${en ? "EN / PT" : "PT / EN"}</a>
            </div>
          </nav>
          <main id="conteudo" class="container main-content">
            ${renderAuthSessionNotice()}

          </main>
          <footer class="site-footer">
            <div class="container footer-inner">
              <div>
                <h3>Universidade de Fortaleza</h3>
                <p>Av. Washington Soares, 1321 · Edson Queiroz<br />Fortaleza / CE · Brasil · CEP 60811-905</p>
              </div>
              <div class="footer-links">
                <div>
                  <a href="#/sobre">Sobre a DRI</a>
                  <a href="#/oportunidades?tab=instituicoes">Convênios</a>
                  <a href="#/contatos">Contatos</a>
                </div>
                <div>
                  <a href="#/privacidade">Privacidade</a>
                  <a href="#/acessibilidade">Acessibilidade</a>
                  <a href="https://unifor.br" target="_blank" rel="noreferrer">Portal oficial Unifor</a>
                </div>
              </div>
            </div>
          </footer>
          <div class="demo-switcher">
            <button class="btn btn-outline" aria-expanded="${ui.profilesOpen}" data-action="toggle-profiles">
              ${icon("globe", 15)} Perfis · Demonstração
            </button>
            ${
              ui.profilesOpen
                ? `
              <div class="profile-menu">
                <div class="profile-heading">
                  NAVEGAR COMO
                  <button class="btn btn-ghost btn-icon" aria-label="Fechar perfis" data-action="toggle-profiles">
                    ${icon("x", 16)}
                  </button>
                </div>
                ${[
                  ["Portal público", "/"],
                  ["Aluno internacional", "/arrival-guide"],
                  ["Docentes e pesquisa", "/docentes"],
                  ["Minha DRI · Aluno", "/minha-dri"],
                  ["Gestão DRI", "/gestao"],
                  ["Marketing", "/marketing"],
                ]
                  .map(
                    ([label, to]) => `
                  <button class="btn btn-ghost" data-action="switch-profile" data-to="${to}">
                    ${esc(label)} ${icon("arrow-right", 14)}
                  </button>
                `,
                  )
                  .join("")}
                <button class="btn btn-ghost profile-dev-btn" data-action="open-dev-panel">
                  DEV ${icon("arrow-right", 14)}

                <small>Sessões temporárias · Reiniciam ao recarregar</small>
              </div>
