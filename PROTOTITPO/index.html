                : ""
            }
          </div>
          ${modalHtml}
        `;

        const dialog = rootEl.querySelector("[data-modal-dialog]");
        if (dialog) {
          document.body.style.overflow = "hidden";
          if (!modalHadFocusInitialized) {
            modalHadFocusInitialized = true;
            const firstFocusable = getFocusables(dialog)[0];
            if (firstFocusable) firstFocusable.focus();
          }
        } else {
          document.body.style.overflow = "";
          if (modalHadFocusInitialized) {
            modalHadFocusInitialized = false;
            if (activeModalPrevFocus && typeof activeModalPrevFocus.focus === "function") {
              activeModalPrevFocus.focus();
            }
            activeModalPrevFocus = null;
          }
        }
      }

      function getFocusables(container) {
        return Array.from(
          container.querySelectorAll(
            'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]',
          ),
        );
      }

      function openModalWithFocus(setter) {
        activeModalPrevFocus = document.activeElement;
        modalHadFocusInitialized = false;
        setter();
        render();
      }

      function closeAllModals() {
        appState.ui.catalogGuideId = null;
        appState.ui.detailInterestModal = false;
        appState.ui.studentCancelId = null;
        appState.ui.gestaoEditor = null;
        appState.ui.devOpen = false;
        render();
      }

      /* =========================================================================
         9. CENTRALIZED EVENT DELEGATION
         ========================================================================= */
      document.addEventListener("keydown", (e) => {
        const dialog = document.querySelector("[data-modal-dialog]");
        if (!dialog) return;
        if (e.key === "Escape") {
          e.preventDefault();
          closeAllModals();
          return;
        }
        if (e.key === "Tab") {
          const focusables = getFocusables(dialog);
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      document.addEventListener("mousedown", (e) => {
        if (e.target && e.target.dataset && e.target.dataset.action === "modal-backdrop") {
          closeAllModals();
        }
      });

      document.addEventListener("click", (e) => {
        const scrollEl = e.target.closest("[data-scroll-target]");
        if (scrollEl) {
          const targetEl = document.getElementById(scrollEl.dataset.scrollTarget);
          if (targetEl) targetEl.scrollIntoView();
          return;
        }

        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.dataset.action;
        const ui = appState.ui;

        switch (action) {
          case "font-dec":
            ui.font = Math.max(-1, ui.font - 1);
            render();
            break;
          case "font-reset":
            ui.font = 0;
            render();
            break;
          case "font-inc":
            ui.font = Math.min(2, ui.font + 1);
            render();
            break;
          case "toggle-contrast":
            ui.contrast = !ui.contrast;
            render();
            break;
          case "toggle-mobile":
            ui.mobileOpen = !ui.mobileOpen;
            render();
            break;
          case "toggle-profiles":
            ui.profilesOpen = !ui.profilesOpen;
            render();
            break;
          case "logout":
            appState.auth = null;
            appState.store = cloneInitialState();
            ui.loginError = "";
            ui.studentSection = "Meus interesses";
            navigate("/");
            break;
          case "switch-profile":
            ui.profilesOpen = false;
            navigate(btn.dataset.to || "/");
            break;
          case "modal-close":
            closeAllModals();
            break;
          case "catalog-tab":
            ui.catalogTab = btn.dataset.tab;
            render();
            break;
          case "catalog-view":
            ui.catalogView = btn.dataset.view;
            render();
            break;
          case "catalog-apply":
            ui.catalogApplied = { ...ui.catalogFilters };
            render();
            break;
          case "catalog-clear":
            ui.catalogFilters = {
              audience: "Todos os públicos",
              country: "Todos os países",
              mode: "Todas",
              status: "Todas",
              date: "",
            };
            ui.catalogApplied = { ...ui.catalogFilters };
            ui.catalogQuery = "";
            render();
            break;
          case "map-region": {
            const region = btn.dataset.region || "mundo";
            if (MAP_PRESETS[region]) {
              ui.mapRegion = region;
              ui.mapView = { ...MAP_PRESETS[region] };
              render();
            }
            break;
          }
          case "map-zoom-in":
          case "map-zoom-out": {
            const factor = action === "map-zoom-in" ? 0.75 : 1.33;
            const prev = ui.mapView;
            const nextW = Math.min(960, Math.max(95, prev.w * factor));
            const nextH = Math.min(440, Math.max(68, prev.h * factor));
            const cx = prev.x + prev.w / 2;
            const cy = prev.y + prev.h / 2;
            ui.mapView = {
              x: Math.min(980 - nextW, Math.max(0, cx - nextW / 2)),
              y: Math.min(470 - nextH, Math.max(0, cy - nextH / 2)),
              w: nextW,
              h: nextH,
            };
            render();
            break;
          }
          case "map-reset":
            ui.mapRegion = "mundo";
            ui.mapView = { ...MAP_PRESETS.mundo };
            render();
            break;
          case "map-select-pin":
            ui.mapSelectedId = btn.dataset.instId || ui.mapSelectedId;
            render();
            break;
          case "map-focus": {
            const inst = PARTNER_INSTITUTIONS.find((i) => i.id === btn.dataset.instId);
            if (inst) {
              ui.mapSelectedId = inst.id;
              if (inst.country === "EUA") {
                ui.mapRegion = "americas";
                ui.mapView = { ...MAP_PRESETS.americas };
              } else if (ui.mapRegion === "americas") {
                ui.mapRegion = "europa";
                ui.mapView = { ...MAP_PRESETS.europa };
              }
              render();
            }
            break;
          }
          case "open-institution-guide":
            openModalWithFocus(() => {
              ui.catalogGuideId = btn.dataset.instId || null;
            });
            break;
          case "sim-reset":
            updateStore((s) => ({ ...s, simulatorProfile: { ...DEFAULT_SIMULATOR_PROFILE } }));
            render();
            break;
          case "open-dev-panel": {
            ui.profilesOpen = false;
            ui.devFeedback = "";
            openModalWithFocus(() => {
              ui.devOpen = true;
            });
            break;
          }
          case "dev-tab":
            ui.devTab = btn.dataset.tab || "fluxos";
            render();
            break;
          case "dev-go": {
            const target = btn.dataset.to || "/";
            ui.devOpen = false;
            navigate(target);
            break;
          }
          case "dev-sim-quiz":
            updateStore((s) => ({
              ...s,
              answers: [
                "Português ou espanhol",
                "Uma boa quantia",
                "Cultura urbana",
                "Experiência acadêmica",
              ],
              selected: (s.opportunities || INITIAL_OPPORTUNITIES).slice(0, 2).map((o) => o.id),
            }));
            ui.devOpen = false;
            navigate("/comparador");
            break;
          case "dev-sim-eligibility": {
            const preset = btn.dataset.preset;
            const nextProfile =
              preset === "compatible"
                ? { ...DEFAULT_SIMULATOR_PROFILE, language: "Inglês (B2)", hasPassport: true }
                : preset === "no-passport"
                  ? { ...DEFAULT_SIMULATOR_PROFILE, hasPassport: false, semester: 2 }
                  : { ...DEFAULT_SIMULATOR_PROFILE, pmg: 6.5 };
            updateStore((s) => ({ ...s, simulatorProfile: nextProfile }));
            ui.devOpen = false;
            navigate("/oportunidades?tab=elegibilidade");
            break;
          }
          case "dev-sim-interest": {
            const storeOpps = appState.store.opportunities || INITIAL_OPPORTUNITIES;
            const targetOpp =
              storeOpps.find((o) => o.status === "Inscrições abertas") || storeOpps[0];
            if (!targetOpp) {
              ui.devFeedback =
                "Nenhuma oportunidade cadastrada. Adicione uma na aba Oportunidades primeiro.";
              render();
              break;
            }
            let created = false;
            updateStore((s) => {
              const existing = s.interests.find(
                (i) => i.title === targetOpp.title && i.status !== "Cancelada",
              );
              if (existing) return s;
              created = true;
              return {
                ...s,
                interests: [
                  ...s.interests,
                  {
                    id: `DRI-2026-${String(s.interests.length + 1).padStart(4, "0")}`,
                    title: targetOpp.title,
                    status: "Recebida",
                    note: `Protocolo de teste (${targetOpp.institution}) criado via Painel Teste Dev.`,
                  },
                ],
                checklist: s.checklist.length
                  ? s.checklist
                  : [...STUDENT_CHECKLIST_ITEMS.slice(0, 2)],
              };
            });
            ui.devFeedback = created
              ? `Manifestação registrada para "${targetOpp.title}" (Recebida) com checklist inicial.`
              : `Já existe uma manifestação ativa para "${targetOpp.title}".`;
            render();
            break;
          }
          case "dev-sim-advance": {
            const active = appState.store.interests.find((i) => i.status !== "Cancelada");
            if (!active) {
              ui.devFeedback =
                "Nenhuma manifestação ativa encontrada. Registre uma manifestação primeiro.";
              render();
              break;
            }
            const next = nextInterestStatus(active.status);
            updateStore((s) => ({
              ...s,
              interests: s.interests.map((item) =>
                item.id === active.id
                  ? {
                      ...item,
                      status: next,
                      note:
                        next === "Em orientação"
                          ? "Plano de estudos em análise com a coordenação. Confirme os prazos consulares."
                          : next === "Concluída"
                            ? "Orientação concluída. Candidatura segue exclusivamente pelo edital oficial."
                            : "Protocolo reaberto em modo de demonstração.",
                    }
                  : item,
              ),
            }));
            ui.devFeedback = `Protocolo ${active.id} atualizado para "${next}".`;
            render();
            break;
          }
          case "dev-sim-cancel-interest": {
            const active = appState.store.interests.find((i) => i.status !== "Cancelada");
            if (!active) {
              ui.devFeedback = "Não há manifestação ativa para cancelar.";
              render();
              break;
            }
            updateStore((s) => ({
              ...s,
              interests: s.interests.map((item) =>
                item.id === active.id ? { ...item, status: "Cancelada" } : item,
              ),
            }));
            ui.devFeedback = `Protocolo ${active.id} cancelado para teste de encerramento.`;
            render();
            break;
          }
          case "dev-sim-checklist": {
            const allCompleted = appState.store.checklist.length === STUDENT_CHECKLIST_ITEMS.length;
            updateStore((s) => ({
              ...s,
              checklist: allCompleted ? [] : [...STUDENT_CHECKLIST_ITEMS],
            }));
            ui.devFeedback = allCompleted
              ? "Checklist de planejamento do aluno limpa (0/6)."
              : "Todos os 6 itens de planejamento marcados em Minha DRI.";
            render();
            break;
          }
          case "dev-sim-draft": {
            const draft = {
              id: `dev-draft-${Date.now()}`,
              title: "Comunicado Teste Dev · Mobilidade 2026.2",
              body: "Conteúdo de teste gerado para validar o fluxo Gestão DRI → Revisão Marketing → Histórico de publicações.",
              english:
                "Test notice generated to validate the DRI Management → Marketing Review → Publication History flow.",
              language: "PT / EN",
              status: "Aguardando Marketing",
              comment: "",
            };
            updateStore((s) => ({ ...s, contents: [...s.contents, draft] }));
            ui.devFeedback =
              "Rascunho PT/EN criado e enviado para a fila do Marketing (Aguardando Marketing).";
            render();
            break;
          }
          case "dev-sim-approve": {
            let approvedTitle;
            updateStore((s) => {
              const res = approvePendingContent(s.contents, Array(7).fill(true));
              approvedTitle = res.approvedTitle;
              return { ...s, contents: res.contents };
            });
            ui.devFeedback = approvedTitle
              ? `Conteúdo "${approvedTitle}" aprovado nos 7 critérios do Marketing (RN01).`
              : "Não há itens com status Aguardando Marketing na fila.";
            render();
            break;
          }
          case "dev-sim-rn01-block": {
            const blocked = canPublish("Aguardando Marketing", [
              true,
              true,
              true,
              true,
              true,
              true,
              false,
            ]);
            ui.devFeedback = blocked
              ? "Atenção: publicação parcial não foi bloqueada."
              : "Bloqueio RN01 confirmado: aprovação com 6 de 7 critérios impediu a publicação.";
            render();
            break;
          }
          case "dev-sim-adjustments": {
            const pending = appState.store.contents.find(
              (c) => c.status === "Aguardando Marketing",
            );
            if (!pending) {
              ui.devFeedback = "Não há itens aguardando revisão do Marketing.";
              render();
              break;
            }
            updateStore((s) => ({
              ...s,
              contents: s.contents.map((c) =>
                c.id === pending.id
                  ? {
                      ...c,
                      status: "Ajustes solicitados",
                      comment:
                        "Ajuste simulado via Teste Dev: revisar link oficial e aviso de visto.",
                    }
                  : c,
              ),
            }));
            ui.devFeedback = `Ajustes solicitados para "${pending.title}" e devolvido para a Gestão DRI.`;
            render();
            break;
          }
          case "dev-opp-preset": {
            const idx = Number(btn.dataset.index);
            const tpl = PRESET_OPPORTUNITY_TEMPLATES[idx];
            if (!tpl) break;
            let createdTitle = "";
            updateStore((s) => {
              const existing = s.opportunities || INITIAL_OPPORTUNITIES;
              const opp = createOpportunityFromInput(
                tpl,
                existing.map((o) => o.id),
              );
              createdTitle = opp.title;
              return { ...s, opportunities: [opp, ...existing] };
            });
            ui.devFeedback = `Oportunidade "${createdTitle}" adicionada e visível imediatamente na guia Oportunidades.`;
            render();
            break;
          }
          case "dev-opp-add-and-go": {
            if (!ui.devOppForm.title.trim()) break;
            updateStore((s) => {
              const existing = s.opportunities || INITIAL_OPPORTUNITIES;
              const opp = createOpportunityFromInput(
                ui.devOppForm,
                existing.map((o) => o.id),
              );
              return { ...s, opportunities: [opp, ...existing] };
            });
            ui.devOppForm = { ...ui.devOppForm, title: "", summary: "" };
            ui.devOpen = false;
            navigate("/oportunidades");
            break;
          }
          case "dev-opp-toggle-status": {
            const id = btn.dataset.id;
            let nextStatus = "";
            updateStore((s) => ({
              ...s,
              opportunities: (s.opportunities || INITIAL_OPPORTUNITIES).map((o) => {
                if (o.id !== id) return o;
                nextStatus = cycleOpportunityStatus(o.status);
                return { ...o, status: nextStatus };
              }),
            }));
            ui.devFeedback = `Situação da oportunidade atualizada para "${nextStatus}".`;
            render();
            break;
          }
          case "dev-opp-remove": {
            const id = btn.dataset.id;
            const target = (appState.store.opportunities || INITIAL_OPPORTUNITIES).find(
              (o) => o.id === id,
            );
            updateStore((s) => ({
              ...s,
              opportunities: (s.opportunities || INITIAL_OPPORTUNITIES).filter((o) => o.id !== id),
              selected: s.selected.filter((x) => x !== id),
            }));
            if (target) {
              ui.devFeedback = `Oportunidade "${target.title}" removida do catálogo.`;
            }
            render();
            break;
          }
          case "dev-opp-restore":
            updateStore((s) => ({
              ...s,
              opportunities: INITIAL_OPPORTUNITIES.map((o) => ({ ...o })),
            }));
            ui.devFeedback = "As 3 oportunidades demonstrativas padrão foram restauradas.";
            render();
            break;
          case "dev-opp-clear":
            updateStore((s) => ({ ...s, opportunities: [], selected: [] }));
            ui.devFeedback = "Lista de oportunidades esvaziada para testar o estado vazio do catálogo.";
            render();
            break;
          case "dev-run-tests": {
            ui.devTestRunCount += 1;
            const results = runDevDiagnosticSuite(appState.store, {
              volatileSessionOk: true,
              hasMainLandmark: Boolean(document.querySelector("main")),
              fontScale: String(ui.font),
              highContrast: ui.contrast,
            });
            const passed = results.filter((r) => r.passed).length;
            ui.devFeedback = `Bateria executada: ${passed} de ${results.length} verificações aprovadas.`;
            render();
            break;
          }
          case "dev-cycle-font":
            ui.font = ui.font >= 2 ? -1 : ui.font + 1;
            ui.devFeedback = `Escala de fonte ajustada para ${ui.font}.`;
            render();
            break;
          case "dev-test-storage": {
            ui.devFeedback = "Confirmado: alterações ficam apenas em memória e são descartadas ao recarregar a página.";
            render();
            break;
          }
          case "dev-seed": {
            updateStore(() => {
              const seeded = approvePendingContent(
                INITIAL_CONTENTS.map((c) => ({ ...c })),
                Array(7).fill(true),
              ).contents;
              const baseOpps = INITIAL_OPPORTUNITIES.map((o) => ({ ...o }));
              const berlimOpp = createOpportunityFromInput(
                PRESET_OPPORTUNITY_TEMPLATES[0],
                baseOpps.map((o) => o.id),
              );
              const ucfOpp = createOpportunityFromInput(PRESET_OPPORTUNITY_TEMPLATES[1], [
                ...baseOpps.map((o) => o.id),
                berlimOpp.id,
              ]);
              return {
                contents: seeded,
                opportunities: [berlimOpp, ucfOpp, ...baseOpps],
                interests: [
                  {
                    id: "DRI-2026-0001",
                    title: "Um semestre em Portugal",
                    status: "Em orientação",
                    note: "Documentação preliminar conferida. Lembrete: visto consular exige carta de aceite.",
                  },
                ],
                answers: [
                  "Português ou espanhol",
                  "Uma boa quantia",
                  "Cultura urbana",
                  "Experiência acadêmica",
                ],
                selected: ["portugal", berlimOpp.id],
                checklist: [...STUDENT_CHECKLIST_ITEMS.slice(0, 3)],
                metrics: INITIAL_METRICS.map((m) => ({ ...m })),
                simulatorProfile: { ...DEFAULT_SIMULATOR_PROFILE, language: "Inglês (B2)", hasPassport: true },
              };
            });
            ui.devFeedback =
              "Cenário completo populado (5 oportunidades, comunicado aprovado, interesse em orientação, quiz e checklist).";
            render();
            break;
          }
          case "dev-reset": {
            appState.store = cloneInitialState();
            ui.devFeedback = "Sessão de demonstração restaurada ao estado inicial em memória.";
            render();
            break;
          }
          case "dev-copy-json": {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard
                .writeText(JSON.stringify(appState.store, null, 2))
                .then(() => {
                  ui.devFeedback = "Snapshot JSON copiado para a área de transferência.";
                  render();
                })
                .catch(() => {
                  ui.devFeedback = "Não foi possível copiar automaticamente neste navegador.";
                  render();
                });
            } else {
              ui.devFeedback = "Clipboard indisponível neste navegador.";
              render();
            }
            break;
          }
          case "detail-open-interest":
            openModalWithFocus(() => {
              ui.detailInterestModal = true;
            });
            break;
          case "detail-register": {
            const o = (appState.store.opportunities || INITIAL_OPPORTUNITIES).find(
              (x) => x.id === appState.route.params.id,
            );
            if (!o || !ui.detailConsent) return;
            updateStore((s) => {
              const found = s.interests.find(
                (i) => i.title === o.title && i.status !== "Cancelada",
              );
              if (found) return s;
              return {
                ...s,
                interests: [
                  ...s.interests,
                  {
                    id: `DRI-2026-${String(s.interests.length + 1).padStart(4, "0")}`,
                    title: o.title,
                    status: "Recebida",
                    note: "",
                  },
                ],
              };
            });
            ui.detailInterestModal = false;
            navigate("/minha-dri");
            break;
          }
          case "quiz-prev":
            if (ui.quizStep > 0) {
              ui.quizStep -= 1;
              render();
            }
            break;
          case "quiz-next":
            if (!appState.store.answers[ui.quizStep]) return;
            if (ui.quizStep === 3) {
              updateStore((s) => ({ ...s, selected: [] }));
              navigate("/comparador");
            } else {
              ui.quizStep += 1;
              render();
            }
            break;
          case "quiz-reset":
            updateStore((s) => ({ ...s, answers: [], selected: [] }));
            ui.quizStep = 0;
            navigate("/quiz");
            break;
          case "arrival-toggle-courses":
            ui.arrivalShowCourses = !ui.arrivalShowCourses;
            render();
            break;
          case "arrival-living":
            ui.arrivalLiving = ui.arrivalLiving === btn.dataset.living ? "" : btn.dataset.living;
            render();
            break;
          case "student-section":
            ui.studentSection = btn.dataset.section;
            render();
            break;
          case "student-open-cancel":
            openModalWithFocus(() => {
              ui.studentCancelId = btn.dataset.id;
            });
            break;
          case "student-confirm-cancel": {
            const cancelId = ui.studentCancelId;
            updateStore((s) => ({
              ...s,
              interests: s.interests.map((i) =>
                i.id === cancelId ? { ...i, status: "Cancelada" } : i,
              ),
            }));
            ui.studentCancelId = null;
            render();
            break;
          }
          case "gestao-section":
            ui.gestaoSection = btn.dataset.section;
            ui.gestaoNotice = "";
            if (ui.gestaoSection === "Indicadores agregados") {
              ui.gestaoMetricEdit = appState.store.metrics.map((m) => ({ ...m }));
            }
            render();
            break;
          case "gestao-clear-notice":
            ui.gestaoNotice = "";
            render();
            break;
          case "gestao-new-draft":
            openModalWithFocus(() => {
              ui.gestaoEditor = {
                id: `draft-${Date.now()}`,
                title: "",
                body: "",
                english: "",
                language: "PT",
                status: "Rascunho",
                comment: "",
              };
            });
            break;
          case "gestao-edit": {
            const target = appState.store.contents.find((c) => c.id === btn.dataset.id);
            if (target) {
              openModalWithFocus(() => {
                ui.gestaoEditor = { ...target };
              });
            }
            break;
          }
          case "gestao-quick-send": {
            const draft = appState.store.contents.find(
              (c) => c.status === "Rascunho" || c.status === "Ajustes solicitados",
            );
            openModalWithFocus(() => {
              ui.gestaoEditor = draft
                ? { ...draft }
                : {
                    id: `draft-${Date.now()}`,
                    title: "",
                    body: "",
                    english: "",
                    language: "PT",
                    status: "Rascunho",
                    comment: "",
                  };
            });
            break;
          }
          case "gestao-submit-review":
            saveGestaoDraft("Aguardando Marketing");
            break;
          case "mkt-view":
            ui.mktView = btn.dataset.view;
            render();
            break;
          case "mkt-decide": {
            const publish = btn.dataset.publish === "true";
            const pending = appState.store.contents.filter(
              (c) => c.status === "Aguardando Marketing",
            );
            const active = pending.find((c) => c.id === ui.mktSelected) ?? pending[0];
            if (!active) return;
            if (publish && !canPublish(active.status, ui.mktChecks)) return;
            if (!publish && !ui.mktComment.trim()) {
              ui.mktError = "Descreva os ajustes necessários antes de devolver à DRI.";
              render();
              return;
            }
            updateStore((s) => {
              let next = {
                ...s,
                contents: s.contents.map((c) =>
                  c.id === active.id
                    ? {
                        ...c,
                        status: publish ? "Publicado" : "Ajustes solicitados",
                        comment: ui.mktComment,
                      }
                    : c,
                ),
              };
              if (publish && active.id.startsWith("metrics-")) {
                try {
                  const parsed = JSON.parse(active.comment);
                  if (Array.isArray(parsed) && parsed.length === 6) {
                    next = { ...next, metrics: parsed };
                  }
                } catch {
                  /* Ignore malformed metrics payload */
                }
              }
              return next;
            });
            ui.mktMessage = publish
              ? "Conteúdo aprovado e publicado no portal de demonstração."
              : "Ajustes solicitados. O comentário já está disponível para a DRI.";
            ui.mktChecks = Array(7).fill(false);
            ui.mktComment = "";
            ui.mktSelected = "";
            ui.mktError = "";
            render();
            break;
          }
        }
      });

      function saveGestaoDraft(status) {
        const ed = appState.ui.gestaoEditor;
        if (!ed || !ed.title.trim() || !ed.body.trim()) return;
        let content = { ...ed, status };
        if (ed.status === "Publicado") {
          content = { ...content, id: `revision-${Date.now()}`, status: "Rascunho" };
        }
        updateStore((s) => ({
          ...s,
          contents: s.contents.some((c) => c.id === content.id)
            ? s.contents.map((c) => (c.id === content.id ? content : c))
            : [...s.contents, content],
        }));
        appState.ui.gestaoEditor = null;
        appState.ui.gestaoNotice =
          status === "Aguardando Marketing"
            ? "Rascunho enviado para revisão do Marketing."
            : "Rascunho salvo. Nenhuma alteração foi publicada.";
        render();
      }

      document.addEventListener("input", (e) => {
        const el = e.target;
        const ui = appState.ui;

        if (el.dataset.action === "catalog-search") {
          ui.catalogQuery = el.value;
          const pos = el.selectionStart;
          render();
          const nextInput = document.getElementById("catalog-search-input");
          if (nextInput) {
            nextInput.focus();
            nextInput.setSelectionRange(pos, pos);
          }
          return;
        }
        if (el.dataset.detailField === "detailPmg") {
          ui.detailPmg = el.value;
          ui.detailResult = "";
          const pos = el.selectionStart;
          render();
          const nextInput = document.getElementById("detail-pmg-input");
          if (nextInput) {
            nextInput.focus();
            try {
              nextInput.setSelectionRange(pos, pos);
            } catch {
              /* Number inputs in some browsers do not support selectionRange */
            }
          }
          return;
        }
        if (el.dataset.gestaoInterestNote) {
          const id = el.dataset.gestaoInterestNote;
          updateStore((s) => ({
            ...s,
            interests: s.interests.map((x) => (x.id === id ? { ...x, note: el.value } : x)),
          }));
          return;
        }
        if (el.dataset.gestaoMetricIndex !== undefined) {
          const idx = Number(el.dataset.gestaoMetricIndex);
          if (!ui.gestaoMetricEdit.length) {
            ui.gestaoMetricEdit = appState.store.metrics.map((m) => ({ ...m }));
          }
          ui.gestaoMetricEdit[idx].value = Math.max(0, Number(el.value));
          return;
        }
        if (el.dataset.editorField && ui.gestaoEditor) {
          ui.gestaoEditor[el.dataset.editorField] = el.value;
          const sendBtn = document.getElementById("gestao-send-review-btn");
          if (sendBtn) {
            const ed = ui.gestaoEditor;
            sendBtn.disabled = !(
              ed.title.trim() &&
              ed.body.trim() &&
              ed.status !== "Publicado" &&
              (ed.language !== "PT / EN" || ed.english.trim())
            );
          }
          return;
        }
        if (el.dataset.devOpp) {
          const field = el.dataset.devOpp;
          ui.devOppForm[field] = el.value;
          if (field === "title") {
            const hasTitle = Boolean(el.value.trim());
            const b1 = document.getElementById("dev-opp-submit-btn");
            const b2 = document.getElementById("dev-opp-submit-go-btn");
            if (b1) b1.disabled = !hasTitle;
            if (b2) b2.disabled = !hasTitle;
          }
          return;
        }
        if (el.dataset.simRange) {
          const field = el.dataset.simRange;
          const nextSim = {
            ...(appState.store.simulatorProfile || DEFAULT_SIMULATOR_PROFILE),
            [field]: Number(el.value),
          };
          updateStore((s) => ({ ...s, simulatorProfile: nextSim }));
          const out =
            field === "semester"
              ? document.getElementById("sim-semester-out")
              : field === "completedPercent"
                ? document.getElementById("sim-progress-out")
                : document.getElementById("sim-pmg-out");
          if (out) {
            out.textContent =
              field === "semester"
                ? `${nextSim.semester}º semestre`
                : field === "completedPercent"
                  ? `${Number(nextSim.completedPercent)}%`
                  : `${Number(nextSim.pmg).toFixed(1)} / 10`;
          }
          const stage = document.getElementById("sim-results-stage");
          if (stage) stage.innerHTML = renderSimulatorResultsHtml();
          return;
        }
        if (el.dataset.action === "mkt-comment") {
          ui.mktComment = el.value;
        }
      });

      document.addEventListener("change", (e) => {
        const el = e.target;
        const ui = appState.ui;

        if (el.dataset.devOpp === "institutionId") {
          const partner = PARTNER_INSTITUTIONS.find((p) => p.id === el.value);
          ui.devOppForm.institutionId = el.value;
          if (partner) {
            ui.devOppForm.country = partner.country;
            ui.devOppForm.city = partner.city;
            ui.devOppForm.audience = partner.audience;
            ui.devOppForm.mode = partner.mode;
          }
          render();
          return;
        }
        if (el.dataset.devOpp) {
          ui.devOppForm[el.dataset.devOpp] = el.value;
          return;
        }
        if (el.dataset.simField) {
          const nextSim = {
            ...(appState.store.simulatorProfile || DEFAULT_SIMULATOR_PROFILE),
            [el.dataset.simField]: el.value,
          };
          updateStore((s) => ({ ...s, simulatorProfile: nextSim }));
          render();
          return;
        }
        if (["sim-passport", "sim-visa", "sim-no-failures"].includes(el.dataset.action)) {
          const field = {
            "sim-passport": "hasPassport",
            "sim-visa": "hasStudentVisa",
            "sim-no-failures": "noFailures",
          }[el.dataset.action];
          const nextSim = {
            ...(appState.store.simulatorProfile || DEFAULT_SIMULATOR_PROFILE),
            [field]: el.checked,
          };
          updateStore((s) => ({ ...s, simulatorProfile: nextSim }));
          render();
          return;
        }
        if (el.dataset.catalogFilter) {
          ui.catalogFilters[el.dataset.catalogFilter] = el.value;
          return;
        }
        if (el.dataset.action === "catalog-sort") {
          ui.catalogSort = el.value;
          render();
          return;
        }
        if (el.dataset.action === "catalog-compare-toggle") {
          const id = el.dataset.id;
          updateStore((s) => ({
            ...s,
            selected: el.checked
              ? s.selected.includes(id)
                ? s.selected
                : [...s.selected, id]
              : s.selected.filter((x) => x !== id),
          }));
          render();
          return;
        }
        if (el.dataset.detailField && el.dataset.detailField !== "detailPmg") {
          ui[el.dataset.detailField] = el.value;
          render();
          return;
        }
        if (el.dataset.action === "detail-consent") {
          ui.detailConsent = el.checked;
          const confirmBtn = document.getElementById("detail-confirm-btn");
          if (confirmBtn) confirmBtn.disabled = !ui.detailConsent;
          return;
        }
        if (el.dataset.action === "quiz-answer") {
          updateStore((s) => {
            const next = [...s.answers];
            next[ui.quizStep] = el.value;
            return { ...s, answers: next };
          });
          render();
          return;
        }
        if (el.dataset.arrivalFilter) {
          ui[el.dataset.arrivalFilter] = el.value;
          ui.arrivalShowCourses = true;
          render();
          return;
        }
        if (el.dataset.action === "student-select-interest") {
          ui.studentSelectedId = el.value;
          render();
          return;
        }
        if (el.dataset.action === "student-checklist-toggle") {
          const item = el.dataset.item;
          if (!item) return;
          updateStore((s) => {
            const list = Array.isArray(s.checklist) ? s.checklist : [];
            return {
              ...s,
              checklist: el.checked
                ? list.includes(item)
                  ? list
                  : [...list, item]
                : list.filter((x) => x !== item),
            };
          });
          render();
          return;
        }
        if (el.dataset.gestaoInterestStatus) {
          const id = el.dataset.gestaoInterestStatus;
          updateStore((s) => ({
            ...s,
            interests: s.interests.map((x) => (x.id === id ? { ...x, status: el.value } : x)),
          }));
          return;
        }
        if (el.dataset.editorField === "language" && ui.gestaoEditor) {
          ui.gestaoEditor.language = el.value;
          render();
          return;
        }
        if (el.dataset.action === "mkt-select") {
          ui.mktSelected = el.value;
          ui.mktChecks = Array(7).fill(false);
          ui.mktComment = "";
          ui.mktError = "";
          render();
          return;
        }
        if (el.dataset.action === "mkt-check") {
          const idx = Number(el.dataset.index);
          ui.mktChecks[idx] = el.checked;
          const pending = appState.store.contents.filter(
            (c) => c.status === "Aguardando Marketing",
          );
          const active = pending.find((c) => c.id === ui.mktSelected) ?? pending[0];
          const pubBtn = document.getElementById("mkt-publish-btn");
          const hint = document.getElementById("mkt-publish-hint");
          if (pubBtn && active) pubBtn.disabled = !canPublish(active.status, ui.mktChecks);
          if (hint) {
            hint.textContent = ui.mktChecks.every(Boolean)
              ? "A aprovação publica a versão revisada no ambiente de demonstração. A DRI recebe a atualização de status."
              : "Confirme os 7 itens de conferência editorial para publicar.";
          }
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.matches("[data-login-form]")) {
          e.preventDefault();
          const formData = new FormData(e.target);
          const username = String(formData.get("username") || "").trim();
          const password = String(formData.get("password") || "");
          const account = DEMO_ACCOUNTS.find(
            (item) => item.username === username && item.password === password,
          );
          if (!account) {
            appState.ui.loginError = "Identificador ou senha incorretos. Confira as credenciais demonstrativas e tente novamente.";
            render();
            return;
          }
          appState.auth = {
            username: account.username,
            role: account.role,
            label: account.label,
            destination: account.destination,
          };
          appState.ui.loginError = "";
          appState.store = cloneInitialState();
          navigate(account.destination);
          return;
        }
        if (e.target.id === "eligibility-form") {
          e.preventDefault();
          appState.ui.detailResult = checkEligibility(
            Number(appState.ui.detailPmg),
            appState.ui.detailProficiency,
          );
          render();
          return;
        }
        if (e.target.id === "gestao-editor-form") {
          e.preventDefault();
          saveGestaoDraft("Rascunho");
          return;
        }
        if (e.target.id === "gestao-metrics-form") {
          e.preventDefault();
          const metricsPayload =
            appState.ui.gestaoMetricEdit.length === 6
              ? appState.ui.gestaoMetricEdit
              : appState.store.metrics;
          const draft = {
            id: `metrics-${Date.now()}`,
            title: "Revisão de metas institucionais agregadas",
            body: metricsPayload.map((m) => `${m.value} — ${m.label}`).join("\n"),
            english: "",
            language: "PT",
            status: "Aguardando Marketing",
            comment: JSON.stringify(metricsPayload),
          };
          updateStore((s) => ({ ...s, contents: [...s.contents, draft] }));
          appState.ui.gestaoNotice =
            "Metas enviadas para revisão. O portal ainda mantém os valores aprovados.";
          render();
          return;
        }
        if (e.target.id === "dev-opp-form") {
          e.preventDefault();
          const f = appState.ui.devOppForm;
          if (!f.title.trim()) return;
          let createdTitle = "";
          updateStore((s) => {
            const existing = s.opportunities || INITIAL_OPPORTUNITIES;
            const opp = createOpportunityFromInput(
              f,
              existing.map((o) => o.id),
            );
            createdTitle = opp.title;
            return { ...s, opportunities: [opp, ...existing] };
          });
          appState.ui.devOppForm = { ...f, title: "", summary: "" };
          appState.ui.devFeedback = `Oportunidade "${createdTitle}" adicionada e visível imediatamente na guia Oportunidades.`;
          render();
        }
      });

      const mapDrag = {
        active: false,
        startX: 0,
        startY: 0,
        startView: { ...MAP_PRESETS.mundo },
      };

      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest && e.target.closest("[data-map-pin]")) return;
        const svg = e.target.closest ? e.target.closest("#dri-world-map") : null;
        if (!svg) return;
        try {
          svg.setPointerCapture(e.pointerId);
        } catch {
          /* Ignore pointer capture errors */
        }
        mapDrag.active = true;
        mapDrag.startX = e.clientX;
        mapDrag.startY = e.clientY;
        mapDrag.startView = { ...appState.ui.mapView };
      });

      document.addEventListener("pointermove", (e) => {
        if (!mapDrag.active) return;
        const svg = document.getElementById("dri-world-map");
        if (!svg) return;
        const rect = svg.getBoundingClientRect();
        const dx = e.clientX - mapDrag.startX;
        const dy = e.clientY - mapDrag.startY;
        const scaleX = mapDrag.startView.w / Math.max(rect.width, 1);
        const scaleY = mapDrag.startView.h / Math.max(rect.height, 1);
        const nextView = {
          ...mapDrag.startView,
          x: Math.min(980 - mapDrag.startView.w, Math.max(0, mapDrag.startView.x - dx * scaleX)),
          y: Math.min(470 - mapDrag.startView.h, Math.max(0, mapDrag.startView.y - dy * scaleY)),
        };
        appState.ui.mapView = nextView;
        svg.setAttribute("viewBox", `${nextView.x} ${nextView.y} ${nextView.w} ${nextView.h}`);
      });

      document.addEventListener("pointerup", () => {
        mapDrag.active = false;
      });

      function showMapPinTooltip(pin) {
        const tip = document.getElementById("world-map-tooltip");
        if (!tip || !pin) return;
        const x = Number(pin.dataset.x);
        const y = Number(pin.dataset.y);
        const view = appState.ui.mapView;
        const name = pin.dataset.instName || "";
        const isOpen = pin.dataset.openCall === "true";
        tip.innerHTML = `<strong>${esc(name)}</strong>${isOpen ? "<span>Inscrições abertas</span>" : ""}`;
        tip.style.left = `${(((x - view.x) / view.w) * 100).toFixed(2)}%`;
        tip.style.top = `${(((y - view.y) / view.h) * 100).toFixed(2)}%`;
        tip.hidden = false;
      }

      function hideMapPinTooltip() {
        const tip = document.getElementById("world-map-tooltip");
        if (tip) tip.hidden = true;
      }

      document.addEventListener("mouseover", (e) => {
        const pin = e.target.closest ? e.target.closest("[data-map-pin]") : null;
        if (pin) showMapPinTooltip(pin);
      });

      document.addEventListener("mouseout", (e) => {
        const pin = e.target.closest ? e.target.closest("[data-map-pin]") : null;
        if (!pin) return;
        if (e.relatedTarget && pin.contains(e.relatedTarget)) return;
        hideMapPinTooltip();
      });

      document.addEventListener("focusin", (e) => {
        const pin = e.target.closest ? e.target.closest("[data-map-pin]") : null;
        if (pin) showMapPinTooltip(pin);
      });

      document.addEventListener("focusout", (e) => {
        const pin = e.target.closest ? e.target.closest("[data-map-pin]") : null;
        if (pin) hideMapPinTooltip();
      });

      window.addEventListener("hashchange", syncRouteFromHash);
      if (!window.location.hash) {
        window.history.replaceState(null, "", "#/");
      }
      syncRouteFromHash();
    </script>
  </body>
</html>
